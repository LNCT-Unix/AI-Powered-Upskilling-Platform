spring.application.name=ai-upskilling-platform
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.docker.compose.enabled=false

# Test Auth properties
app.auth.jwt.secret=0123456789012345678901234567890123456789
app.auth.jwt.issuer=ai-upskilling-platform
app.auth.jwt.access-token-ttl-seconds=900
app.auth.jwt.refresh-token-ttl-seconds=2592000
app.auth.jwt.login-code-ttl-seconds=60
app.auth.jwt.link-intent-ttl-seconds=300

app.auth.frontend.web-callback-url=http://localhost:5173/auth/callback
app.auth.frontend.mobile-callback-url=myapp://auth/callback
app.auth.frontend.web-error-url=http://localhost:5173/auth/error
app.auth.frontend.mobile-error-url=myapp://auth/error

app.auth.cors.allowed-origins=http://localhost:5173,http://localhost:3000
