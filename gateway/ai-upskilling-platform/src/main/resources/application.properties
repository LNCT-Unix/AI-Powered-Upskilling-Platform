spring.application.name=ai-upskilling-platform

# Server port
server.port=${SERVER_PORT:8080}

# PostgreSQL Datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Docker Compose runtime integration (disabled if docker not running locally)
spring.docker.compose.enabled=false

# Spring Security OAuth2 Client Configuration
# Google OIDC
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-client-id-placeholder}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Application Authentication Properties
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET}
app.auth.jwt.issuer=ai-upskilling-platform
app.auth.jwt.access-token-ttl-seconds=900
app.auth.jwt.refresh-token-ttl-seconds=2592000
app.auth.jwt.login-code-ttl-seconds=60
app.auth.jwt.link-intent-ttl-seconds=300

# Frontend Redirects and Callbacks
app.auth.frontend.web-callback-url=${APP_FRONTEND_WEB_CALLBACK_URL:http://localhost:5173/auth/callback}
app.auth.frontend.mobile-callback-url=${APP_FRONTEND_MOBILE_CALLBACK_URL:myapp://auth/callback}
app.auth.frontend.web-error-url=${APP_FRONTEND_WEB_ERROR_URL:http://localhost:5173/auth/error}
app.auth.frontend.mobile-error-url=${APP_FRONTEND_MOBILE_ERROR_URL:myapp://auth/error}

# CORS Configuration
app.auth.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
